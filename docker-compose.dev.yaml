services:
  postgresql:
    image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: benetnasch
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - benetnasch-dev-postgres-data:/var/lib/postgresql/data
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d benetnasch"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.1-trixie@sha256:9c5c616b6e72ea6e38125bb9b12eac2dcd92cd57f8f811ee2fb965ae4cb0f16e
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "26379:6379"
    volumes:
      - benetnasch-dev-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      TZ: Asia/Shanghai
    ports:
      - "27700:7700"
    volumes:
      - benetnasch-dev-meili-data:/meili_data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - benetnasch-dev-minio-data:/data

  backend:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    environment:
      BENETNASCH_ENV: dev-clone
      JWT_ALLOW_EPHEMERAL: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash-vision-exp}
      ALIBAILIAN_API_KEY: ${ALIBAILIAN_API_KEY:-}
      ALIBAILIAN_BASE_URL: ${ALIBAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ALIBAILIAN_MODEL: ${ALIBAILIAN_MODEL:-qwen3.7-text-embedding}
      ALIBAILIAN_MODEL2: ${ALIBAILIAN_MODEL2:-qwen3.7-text-embedding-flash}
      SGLANG_API_KEY: ${SGLANG_API_KEY:-}
      SGLANG_BASE_URL: ${SGLANG_BASE_URL:-}
      SGLANG_MODEL: ${SGLANG_MODEL:-}
      SGLANG_MODEL_ID: ${SGLANG_MODEL_ID:-}
      BENETNASCH_AI_ENABLED: "false"
      BENETNASCH_AI_OBSERVABILITY: "false"
      BENETNASCH_AI_PROVIDER_PROBE: "false"
      BENETNASCH_AI_LOCAL_EMBEDDING: "false"
      BENETNASCH_AI_LOCAL_EMBEDDING_MODEL_VERSION: ""
      BENETNASCH_AI_LOCAL_EMBEDDING_INDEX_VERSION: ""
      BENETNASCH_AI_LOCAL_EMBEDDING_BATCH_SIZE: "1"
      BENETNASCH_AI_VISION: "false"
      BENETNASCH_AI_ARTICLE_INDEXING: "false"
      BENETNASCH_AI_SPACE_COMPANION: ${BENETNASCH_AI_SPACE_COMPANION:-false}
      BENETNASCH_AI_SPACE_COMPANION_PUBLISH: ${BENETNASCH_AI_SPACE_COMPANION_PUBLISH:-false}
      BENETNASCH_SPACE_COMPANION_READ_TOKEN: ${BENETNASCH_SPACE_COMPANION_READ_TOKEN:-}
      BENETNASCH_SPACE_COMPANION_PUBLISH_TOKEN: ${BENETNASCH_SPACE_COMPANION_PUBLISH_TOKEN:-}
      BENETNASCH_SPACE_COMPANION_AGENT_ID: ${BENETNASCH_SPACE_COMPANION_AGENT_ID:-moonfei}
      TZ: Asia/Shanghai
    volumes:
      - ${DEV_RUNTIME_DIR:?DEV_RUNTIME_DIR is required}:/app/runtime:ro
      - ${DEV_RESOURCE_DIR:?DEV_RESOURCE_DIR is required}:/app/resource
      - ./docs:/app/docs:ro
    working_dir: /app
    command: ["/app/runtime/benetnasch"]
    ports:
      - "28777:7777"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "28080:80"
      - "28008:8008"
      - "28018:8018"
      - "28028:8028"
    volumes:
      - ./deploy/dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/blog/dist:/srv/vue/blog:ro
      - ./web/admin/dist:/srv/vue/admin:ro
      - ./web/admin-next/dist:/srv/vue/admin-next:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  benetnasch-dev-postgres-data:
    name: benetnasch-dev-postgres-data
  benetnasch-dev-redis-data:
    name: benetnasch-dev-redis-data
  benetnasch-dev-meili-data:
    name: benetnasch-dev-meili-data
  benetnasch-dev-minio-data:
    name: benetnasch-dev-minio-data
