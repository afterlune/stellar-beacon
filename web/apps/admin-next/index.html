<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var key = 'stellar-beacon.admin.theme'
          var theme = localStorage.getItem(key)
          if (theme === null) {
            theme = localStorage.getItem('benetnasch.admin.theme')
            if (theme !== null) localStorage.setItem(key, theme)
          }
          // 默认浅色：只有明确选过深色的人才留在深色。
          var value = theme === 'dark' ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', value)
          document.documentElement.style.colorScheme = value
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#d5dcf5" media="(prefers-color-scheme: light)" />
    <meta name="description" content="星际信标 · Stellar Beacon 博客编辑台" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <title>星际信标编辑台 · Stellar Beacon</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
