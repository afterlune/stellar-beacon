name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [blog, admin-next]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Audit complete frontend dependency tree
        if: matrix.app == 'blog'
        working-directory: web
        run: npm audit --registry=https://registry.npmjs.org

      - name: Typecheck blog
        if: matrix.app == 'blog'
        working-directory: web
        run: npm run typecheck --workspace=@stellar-beacon/blog

      - name: Audit production dependencies
        working-directory: web/apps/${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: web
        run: npm run build:${{ matrix.app == 'admin-next' && 'admin' || 'blog' }}

      - name: Install Playwright Chromium
        if: matrix.app == 'admin-next'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run admin baseline E2E
        if: matrix.app == 'admin-next'
        working-directory: web
        run: npm run test:admin

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Check Go toolchain consistency
        shell: bash
        run: bash scripts/checks/check-toolchain-version.sh

      - name: Check SQL construction
        shell: bash
        run: bash scripts/checks/check-no-dynamic-sql.sh

      - name: Check migrated service boundaries
        shell: bash
        run: bash scripts/checks/check-service-db-boundary.sh

      - name: Check service infrastructure boundary
        shell: bash
        run: bash scripts/checks/check-service-infra-boundary.sh

      - name: Check service constructor boundary
        shell: bash
        run: bash scripts/checks/check-service-constructor-boundary.sh

      - name: Check removed Tencent CAPTCHA integration
        shell: bash
        run: bash scripts/checks/check-no-tencent-captcha.sh

      - name: Check forbidden OpenPGP imports
        shell: bash
        run: bash scripts/checks/check-no-openpgp.sh

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_ENABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run isolated PostgreSQL and Redis tests
        run: go test -tags=integration ./internal/infrastructure/persistence/postgres/repository -run TestEphemeralPostgresAndRedis -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run govulncheck
        shell: bash
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Check forbidden OpenPGP imports
        shell: bash
        run: bash scripts/checks/check-no-openpgp.sh

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --pull --tag stellar-beacon:ci .

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stellar-beacon:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  container-scan-services:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
          - redis:8.10.1-trixie@sha256:9c5c616b6e72ea6e38125bb9b12eac2dcd92cd57f8f811ee2fb965ae4cb0f16e
          - caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          - getmeili/meilisearch:v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
          - minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    steps:
      - name: Scan ${{ matrix.image }}
        id: service-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Summarize service image findings
        if: steps.service-scan.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Third-party service image vulnerability report"
            echo ""
            echo 'Trivy found fixable HIGH/CRITICAL findings in `${{ matrix.image }}`.'
            echo ""
            echo "This scan is report-only because the finding is in an upstream service image; update the pinned digest when the vendor publishes a patched image. The application image scan remains blocking."
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
