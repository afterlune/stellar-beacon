name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [blog, admin]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/${{ matrix.app }}
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: web/${{ matrix.app }}
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Check Go toolchain consistency
        shell: bash
        run: bash scripts/check-toolchain-version.sh

      - name: Check SQL construction
        shell: bash
        run: bash scripts/check-no-dynamic-sql.sh

      - name: Check migrated service boundaries
        shell: bash
        run: bash scripts/check-service-db-boundary.sh

      - name: Check service infrastructure boundary
        shell: bash
        run: bash scripts/check-service-infra-boundary.sh

      - name: Check service constructor boundary
        shell: bash
        run: bash scripts/check-service-constructor-boundary.sh

      - name: Check removed Tencent CAPTCHA integration
        shell: bash
        run: bash scripts/check-no-tencent-captcha.sh

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_ENABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run isolated PostgreSQL and Redis tests
        run: go test -tags=integration ./app/infra/persistence/repository -run TestEphemeralPostgresAndRedis -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run govulncheck
        shell: bash
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
