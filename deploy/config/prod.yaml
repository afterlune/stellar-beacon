listen:
  host: ""
  port: 7777
# referer host
verification: "example.com"
public:
  site_url: "https://example.com"
# MeiliSearch 密码至少16字节
meiliSearch:
  host: "172.17.0.1"
  apiKey: "${MEILI_MASTER_KEY}"
  port: 7700
# redis
redis:
  host: "172.17.0.1"
  password: "${REDIS_PASSWORD}"
  port: 6379
  db: 1
# email smtp
emailSmtp:
  smtp: "smtp.example.com"
  email: "blog@example.com"
  password: "${SMTP_PASSWORD}"
  port: 465
  tls: true
  auth: true
# database postgres
database:
  driverName: "postgres"
  host: "172.17.0.1"
  username: "postgres"
  password: "${POSTGRES_PASSWORD}"
  port: 5432
  baseName: "stellar_beacon"
# oss
oss:
  provider: "aliyun"
  endPoint: "https://oss-cn-shanghai.aliyuncs.com"
  region: "cn-shanghai"
  publicUrl: "https://example-bucket.oss-cn-shanghai.aliyuncs.com/"
  publicRead: false
  accessKeyID: "${ALIYUN_OSS_ACCESS_KEY_ID}"
  accessKeySecret: "${ALIYUN_OSS_ACCESS_KEY_SECRET}"
  bucketName: "example-bucket"
