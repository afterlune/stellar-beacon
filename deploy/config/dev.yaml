listen:
  host: ""
  port: 7777
# referer host
verification: "127.0.0.1"
public:
  site_url: "http://127.0.0.1:8080"
# MeiliSearch 密码至少16字节
meiliSearch:
  host: "host.docker.internal"
  apiKey: "${MEILI_MASTER_KEY}"
  port: 7700
# redis
redis:
  host: "host.docker.internal"
  password: "${REDIS_PASSWORD}"
  port: 6379
  db: 1
# email smtp 163
emailSmtp:
  smtp: "smtp.163.com"
  email: "dev@example.test"
  password: "${SMTP_PASSWORD}"
  port: 465
  tls: true
  auth: true
# database postgres
database:
  driverName: "postgres"
  host: "host.docker.internal"
  username: "postgres"
  password: "${POSTGRES_PASSWORD}"
  port: 5432
  baseName: "stellar_beacon"
# oss
oss:
  provider: "aliyun"
  endPoint: "https://oss-cn-shanghai.aliyuncs.com"
  region: "cn-shanghai"
  publicUrl: "http://i.example.invalid/"
  publicRead: false
  accessKeyID: "${ALIYUN_OSS_ACCESS_KEY_ID}"
  accessKeySecret: "${ALIYUN_OSS_ACCESS_KEY_SECRET}"
  bucketName: "example-bucket"

logger:
  env: dev
