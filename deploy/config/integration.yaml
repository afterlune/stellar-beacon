listen:
  host: ""
  port: 7777
verification: "127.0.0.1"
public:
  site_url: "http://127.0.0.1:18080"
cors:
  allowed_origins:
    - "http://127.0.0.1:18080"
    - "http://127.0.0.1:18008"
meiliSearch:
  host: "meilisearch"
  apiKey: "${MEILI_MASTER_KEY}"
  port: 7700
redis:
  host: "redis"
  password: "${REDIS_PASSWORD}"
  port: 6379
  db: 1
emailSmtp:
  smtp: "mailpit"
  email: "integration@example.test"
  password: "${SMTP_PASSWORD}"
  port: 1025
  tls: false
  auth: false
database:
  driverName: "postgres"
  host: "postgresql"
  username: "postgres"
  password: "${POSTGRES_PASSWORD}"
  port: 5432
  baseName: "stellar_beacon"
oss:
  provider: "minio"
  endPoint: "http://minio:9000"
  region: "us-east-1"
  publicUrl: "http://127.0.0.1:19000/stellar-beacon-integration"
  publicRead: true
  accessKeyID: "${MINIO_ROOT_USER}"
  accessKeySecret: "${MINIO_ROOT_PASSWORD}"
  bucketName: "stellar-beacon-integration"
logger:
  env: integration
