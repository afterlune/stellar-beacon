definitions:
  api.agentChatHTTPRequest:
    properties:
      message:
        type: string
      sessionId:
        type: string
      timeRange:
        properties:
          from:
            type: string
          to:
            type: string
        type: object
    type: object
  model.ResultVO:
    properties:
      code:
        type: integer
      data: {}
      flag:
        type: boolean
      message:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 面向数字空间公开内容、管理控制面和 Agent 能力的 HTTP API。Companion 机器协议另见 docs/space-companion-protocol.md。
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benetnasch 数字空间 API
  version: "1.0"
paths:
  /:
    get:
      description: 获取系统信息
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: benetnasch信息
  /about:
    get:
      description: 查看关于我信息
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: benetnasch信息
  /admin:
    get:
      description: 获取系统后台信息
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: benetnasch信息
  /admin/about:
    put:
      description: 修改关于我信息
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: benetnasch信息
  /admin/agent/emergency:
    put:
      description: 暂停或恢复公开 Agent 能力及自主行为 worker
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: Agent 紧急开关
  /admin/ai/memory/assertions:
    get:
      description: 查询带来源、版本、有效期和状态的长期记忆断言
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: Agent 记忆断言
  /admin/ai/memory/assertions/{id}:
    delete:
      description: 撤回一条长期记忆断言并保留审计历史
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: 撤回 Agent 记忆
  /admin/ai/memory/assertions/{id}/history:
    get:
      description: 查询单条长期记忆断言的不可变修订历史
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: Agent 记忆历史
  /admin/ai/memory/conflicts:
    get:
      description: 查询需要人工处理的长期记忆冲突及其成员
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: Agent 记忆冲突
  /admin/ai/memory/conflicts/{id}/reject:
    post:
      description: 驳回冲突集合中的全部断言并保留审计历史
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: 驳回 Agent 记忆冲突
  /admin/ai/memory/conflicts/{id}/resolve:
    post:
      description: 显式选择冲突赢家，其他成员转为 stale
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: 解决 Agent 记忆冲突
  /admin/ai/observability:
    get:
      description: 返回可供外部监控聚合的脱敏 Provider 与索引指标
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ResultVO'
      summary: AI/搜索运行时观测
  /admin/ai/profile:
    get:
