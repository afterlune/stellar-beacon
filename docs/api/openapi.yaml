      parameters:
        - { name: range, in: query, schema: { type: string, enum: [7d, 30d, 90d, 12m] } }
        - { name: sort, in: query, schema: { type: string, enum: [clicks, clickRate] } }
        - { name: sourceArticleId, in: query, schema: { type: integer, minimum: 1 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /admin/content/analytics/articles/{articleId}:
    get:
