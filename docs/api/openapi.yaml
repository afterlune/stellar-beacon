      operationId: listOwnerCommentAppeals
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CollectionId' }]
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comment-appeals/{appealId}:
    put:
      tags: [auth]
      summary: Restore or reject an appeal as the reading-list owner
      description: A rejection keeps the appeal at the owner stage so the reader can escalate it.
      operationId: resolveOwnerCommentAppeal
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
        - { name: appealId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
