openapi: 3.0.3
info:
  title: Stellar Beacon API
  version: 1.0.0
  description: Versioned HTTP contract for the Stellar Beacon blog and administration apps.
servers:
  - url: /api/v1
tags:
  - name: public
  - name: auth
  - name: admin
paths:
  /public/:
    get: { tags: [public], summary: Get blog home information, operationId: getBlogHomeInfo, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/about:
    get: { tags: [public], summary: Get about page, operationId: getAbout, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles:
    get: { tags: [public], summary: List public articles, operationId: listArticles, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/featured:
    get: { tags: [public], summary: Get top and featured articles, operationId: listFeaturedArticles, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/by-category:
    get:
      tags: [public]
      summary: List articles by category
      description: Passing `categoryName` (or `name`) aggregates every author that uses the same normalised category name; `categoryId` keeps the original single-row behaviour.
      operationId: listArticlesByCategory
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/articles/by-tag:
    get:
      tags: [public]
      summary: List articles by tag
      description: Passing `tagName` aggregates every author that uses the same normalised tag name; `tagId` keeps the original single-row behaviour.
      operationId: listArticlesByTag
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/articles/search:
    get: { tags: [public], summary: Search articles, operationId: searchArticles, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/{articleId}:
    get: { tags: [public], summary: Get article detail, operationId: getArticle, parameters: [{ $ref: '#/components/parameters/ArticleId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/{articleId}/access:
    post: { tags: [public], summary: Verify article password, operationId: accessArticle, parameters: [{ $ref: '#/components/parameters/ArticleId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/{articleId}/read-sessions:
    post:
      tags: [public]
      summary: Record an anonymous article reading session
      description: Accepts only a session id, active milliseconds and maximum scroll percentage. It does not accept or persist account, IP, User-Agent or referrer data.
      operationId: trackArticleReadSession
      parameters: [{ $ref: '#/components/parameters/ArticleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleReadSession' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/articles/{articleId}/continuation-events:
    post:
      tags: [public]
      summary: Record an anonymous article continuation event
      description: Accepts one allow-listed series or related-reading impression/click event. Clicks include the public target and placement; the endpoint does not accept account, session, IP, User-Agent or referrer data.
      operationId: trackArticleContinuationEvent
      parameters: [{ $ref: '#/components/parameters/ArticleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleContinuationEvent' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/archives:
    get: { tags: [public], summary: List article archives, operationId: listArchives, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/categories:
    get: { tags: [public], summary: List categories, operationId: listCategories, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/tags:
    get: { tags: [public], summary: List tags, operationId: listTags, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/tags/top:
    get: { tags: [public], summary: List popular tags, operationId: listPopularTags, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/comments:
    get: { tags: [public], summary: List comments, operationId: listComments, parameters: [{ name: focusCommentId, in: query, required: false, schema: { type: integer, format: int64 } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [public], summary: Create comment, operationId: createComment, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/comments/top:
    get: { tags: [public], summary: List recent comments, operationId: listRecentComments, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/comments/{commentId}/replies:
    get: { tags: [public], summary: List comment replies, operationId: listCommentReplies, parameters: [{ $ref: '#/components/parameters/CommentId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/links:
    get: { tags: [public], summary: List friend links, operationId: listFriendLinks, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/links/applications:
    post: { tags: [public], summary: Submit a friend link application, operationId: applyFriendLink, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/series:
    get: { tags: [public], summary: List article collections, operationId: listPublicSeries, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/series/{seriesId}:
    get: { tags: [public], summary: Get one collection with its ordered articles, operationId: getPublicSeries, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/albums:
    get: { tags: [public], summary: List photo albums, operationId: listAlbums, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/albums/{albumId}/photos:
    get: { tags: [public], summary: List album photos, operationId: listAlbumPhotos, parameters: [{ $ref: '#/components/parameters/AlbumId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/talks:
    get: { tags: [public], summary: List talks, operationId: listTalks, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/talks/{talkId}:
    get: { tags: [public], summary: Get talk detail, operationId: getTalk, parameters: [{ $ref: '#/components/parameters/TalkId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/users/{userInfoId}:
    get: { tags: [public], summary: Get public user information, operationId: getPublicUser, parameters: [{ $ref: '#/components/parameters/UserInfoId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/feed:
    get:
      tags: [public]
      summary: List the public community feed
      description: |
        Returns public articles or talks. `sort=latest` (the default) keeps the
        historical recency ordering, `sort=hot` ranks articles by the reader
        signals of the last seven days (favourites, approved comments, likes and
        unique readers) and `sort=featured` returns featured articles only.
        Talks always use the recency ordering. Private, draft, scheduled, deleted
        and moderated content is never returned.
      operationId: listPublicFeed
      parameters:
        - { name: type, in: query, required: false, schema: { type: string, enum: [article, talk] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [latest, hot, featured] } }
        - { name: featured, in: query, required: false, description: 'Legacy featured-only filter; still honoured for sort=latest.', schema: { type: integer, enum: [0, 1] } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/topics:
    get:
      tags: [public]
      summary: List the public topic plaza
      description: Groups public categories, tags and series, each ranked by the same seven-day reader signal the hot feed uses. Empty groups are dropped; `size` defaults to 12 and is capped at 30.
      operationId: listPublicTopics
      parameters:
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 30, default: 12 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/authors:
    get:
      tags: [public]
      summary: List public authors
      description: Ranks authors that still have public content. `sort=articles` (the default) orders by public article count, `sort=followers` by follower count and `sort=active` by the most recent public publish.
      operationId: listPlatformAuthors
      parameters:
        - { name: sort, in: query, required: false, schema: { type: string, enum: [articles, followers, active] } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/authors/{handle}:
    get: { tags: [public], summary: Get a public author profile, operationId: getAuthorByHandle, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/authors/{handle}/articles:
    get:
      tags: [public]
      summary: List an author's public articles
      description: '`sort=latest` (the default) is recency ordered; `sort=hot` ranks the author''s articles by the seven-day reader signal.'
      operationId: listAuthorArticles
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [latest, hot] } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/authors/{handle}/talks:
    get: { tags: [public], summary: List an author's public talks, operationId: listAuthorTalks, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/authors/{handle}/series:
    get: { tags: [public], summary: List an author's public series, operationId: listAuthorSeries, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/collections:
    get:
      tags: [public]
      summary: List public reading lists
      description: Only public, moderation-visible lists with at least one currently public article are returned. Since each member article is an immutable reference rather than a content snapshot, private, deleted, draft or hidden articles disappear immediately.
      operationId: listPublicCollections
      parameters:
        - { name: sort, in: query, required: false, schema: { type: string, enum: [latest, hot], default: latest } }
        - { name: current, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/collections/{slug}:
    get:
      tags: [public]
      summary: Get a public or unlisted reading list by slug
      description: Private and moderated lists are absent. An unlisted list is reachable by its stable slug but never appears in discovery.
      operationId: getPublicCollection
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/authors/{handle}/collections:
    get: { tags: [public], summary: List an author's public reading lists, operationId: listAuthorCollections, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/reports/visit:
    post: { tags: [public], summary: Report a visit, operationId: reportVisit, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/diagnostics/business-error:
    get: { tags: [public], summary: Trigger a business error for diagnostics, operationId: triggerBusinessError, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/login:
    post: { tags: [auth], summary: Sign in, operationId: login, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/logout:
    post: { tags: [auth], summary: Sign out, operationId: logout, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/register:
    post: { tags: [auth], summary: Register, operationId: register, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/verification-code:
    get: { tags: [auth], summary: Send verification code, operationId: sendVerificationCode, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/password:
    put: { tags: [auth], summary: Update password, operationId: updatePassword, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me:
    put: { tags: [auth], summary: Update current user, operationId: updateCurrentUser, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/avatar:
    post: { tags: [auth], summary: Update current user avatar, operationId: updateCurrentAvatar, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/email:
    put: { tags: [auth], summary: Bind current user email, operationId: bindCurrentEmail, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/subscription:
    put: { tags: [auth], summary: Update subscription, operationId: updateSubscription, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/notifications:
    put: { tags: [auth], summary: Set the comment email notification preference, operationId: updateCommentNotice, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    get: { tags: [auth], summary: List unified publish and interaction notifications, operationId: listFollowNotifications, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/notifications/unread-count:
    get: { tags: [auth], summary: Count unified unread notifications, operationId: getUnreadFollowNotifications, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/notifications/read:
    post: { tags: [auth], summary: Mark unified notifications read through a cursor, operationId: markFollowNotificationsRead, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/notification-preferences:
    put:
      tags: [auth]
      summary: Set the in-app notification preferences
      description: |
        `notifyInteraction` keeps its historical meaning and is always written.
        `notifyTopic` is optional: when the field is omitted the stored topic
        preference stays untouched, so older clients cannot reset it.
      operationId: updateNotificationPreferences
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/topic-subscriptions:
    get: { tags: [auth], summary: List the topics subscribed by the current account, operationId: listTopicSubscriptions, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/topic-subscriptions/{topicType}/{topicKey}:
    put:
      tags: [auth]
      summary: Subscribe to a normalised topic
      description: '`topicType` is `category` or `tag`; `topicKey` is the trimmed lower-cased topic name. A topic with no public article yet is rejected.'
      operationId: subscribeTopic
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: topicType, in: path, required: true, schema: { type: string, enum: [category, tag] } }
        - { name: topicKey, in: path, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
    delete:
      tags: [auth]
      summary: Unsubscribe from a normalised topic
      operationId: unsubscribeTopic
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: topicType, in: path, required: true, schema: { type: string, enum: [category, tag] } }
        - { name: topicKey, in: path, required: true, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/topic-subscriptions/{topicType}/{topicKey}/mute:
    put:
      tags: [auth]
      summary: Mute or unmute one topic subscription
      description: A muted subscription keeps appearing in the topic feed but never reaches the notification inbox.
      operationId: muteTopicSubscription
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: topicType, in: path, required: true, schema: { type: string, enum: [category, tag] } }
        - { name: topicKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: integer, enum: [0, 1] }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/topic-feed:
    get:
      tags: [auth]
      summary: List published articles matching the account topic subscriptions
      description: Only articles count, because talks carry no category or tag. The feed includes the reader's own articles; the notification inbox excludes them.
      operationId: listTopicSubscriptionFeed
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/collection-subscriptions/{collectionId}:
    get: { tags: [auth], summary: Get collection subscription status, operationId: getCollectionSubscriptionStatus, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/CollectionId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    put: { tags: [auth], summary: Subscribe to a public or unlisted collection, operationId: subscribeCollection, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/CollectionId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [auth], summary: Unsubscribe from a collection, operationId: unsubscribeCollection, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/CollectionId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/collection-subscriptions/{collectionId}/mute:
    put:
      tags: [auth]
      summary: Mute or unmute one collection subscription
      operationId: muteCollectionSubscription
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CollectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: integer, enum: [0, 1] }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/collection-subscriptions:
    get: { tags: [auth], summary: List the current account's collection subscriptions, operationId: listCollectionSubscriptions, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/collection-feed:
    get: { tags: [auth], summary: List collection updates since each subscription began, operationId: listCollectionSubscriptionFeed, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/collection-reactions:
    get:
      tags: [auth]
      summary: List collections saved by the current account
      operationId: listMyCollectionReactions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reaction, in: query, required: true, schema: { type: string, enum: [favorite] } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
    put:
      tags: [auth]
      summary: Set the current account's like or favorite state for a public or unlisted collection
      operationId: setCollectionReaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionReactionInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/collection-reactions/state:
    get:
      tags: [auth]
      summary: Read the current account's like and favorite state for one collection
      operationId: getCollectionReactionState
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: collectionId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/comment-reactions:
    put:
      tags: [auth]
      summary: Set the current account's like state for a visible comment or reply
      operationId: setCommentReaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentId, active]
              properties:
                commentId: { type: integer, format: int64, minimum: 1 }
                active: { type: boolean }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/recommendations/query:
    post:
      tags: [auth]
      summary: Query the personalized public-article feed
      description: Uses follows, topic subscriptions, reactions and at most twenty transient local reading seed ids. Seed ids are request-only, are not persisted, and the result never includes self-authored or already-followed authors.
      operationId: queryRecommendations
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cursor: { type: string }
                size: { type: integer, minimum: 1, maximum: 24, default: 12 }
                seedArticleIds:
                  type: array
                  maxItems: 20
                  items: { type: integer, format: int64 }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/recommendation-feedback:
    get:
      tags: [auth]
      summary: List recommendation preferences
      operationId: listRecommendationFeedback
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Result' } }
    put:
      tags: [auth]
      summary: Hide an article or reduce an author/topic
      operationId: saveRecommendationFeedback
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType]
              properties:
                targetType: { type: string, enum: [article, author, topic] }
                articleId: { type: integer, format: int64 }
                authorId: { type: integer, format: int64 }
                topicType: { type: string, enum: [category, tag] }
                topicKey: { type: string }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/recommendation-feedback/{feedbackId}:
    delete:
      tags: [auth]
      summary: Restore an article, author or topic recommendation preference
      operationId: deleteRecommendationFeedback
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: feedbackId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/following/{authorId}:
    put: { tags: [auth], summary: Follow an author, operationId: followAuthor, security: [{ bearerAuth: [] }], parameters: [{ name: authorId, in: path, required: true, schema: { type: integer, format: int64 } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [auth], summary: Unfollow an author, operationId: unfollowAuthor, security: [{ bearerAuth: [] }], parameters: [{ name: authorId, in: path, required: true, schema: { type: integer, format: int64 } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/following:
    get: { tags: [auth], summary: List authors followed by the current account, operationId: listFollowingAuthors, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/followers:
    get: { tags: [auth], summary: List followers of the current account, operationId: listAuthorFollowers, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/following-feed:
    get: { tags: [auth], summary: List content from followed authors, operationId: listFollowingFeed, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/reactions:
    put: { tags: [auth], summary: Set the like or favourite state of an article, operationId: toggleArticleReaction, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    get: { tags: [auth], summary: List the current account reactions, operationId: listMyArticleReactions, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/reactions/state:
    get: { tags: [auth], summary: Read reaction state for a set of articles, operationId: listArticleReactionStates, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /studio/collections:
    get: { tags: [auth], summary: List reading lists owned by the current account, operationId: listStudioCollections, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post:
      tags: [auth]
      summary: Create a reading list
      operationId: createStudioCollection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionSaveInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}:
    get: { tags: [auth], summary: Get an owned reading list with ordered items, operationId: getStudioCollection, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/CollectionId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    put:
      tags: [auth]
      summary: Update owned reading-list metadata
      operationId: updateStudioCollection
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CollectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionSaveInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
    delete: { tags: [auth], summary: Soft-delete an owned reading list, operationId: deleteStudioCollection, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/CollectionId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /studio/collections/{collectionId}/items/{articleId}:
    put:
      tags: [auth]
      summary: Add or update one article in an owned reading list
      operationId: addStudioCollectionItem
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
        - { $ref: '#/components/parameters/ArticleId' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionItemInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
    delete: { tags: [auth], summary: Remove one article from an owned reading list, operationId: removeStudioCollectionItem, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/CollectionId' }, { $ref: '#/components/parameters/ArticleId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /studio/collections/{collectionId}/order:
    put:
      tags: [auth]
      summary: Replace the complete manual order of an owned reading list
      operationId: reorderStudioCollection
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CollectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionOrderInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comments/{commentId}/pin:
    put:
      tags: [auth]
      summary: Pin or unpin one root comment on an owned reading list
      description: >-
        Only the reading-list owner may moderate. The comment must be an approved,
        undeleted root comment that belongs to the reading list. Pinning a second
        root comment automatically unpins the previous one; at most one root comment
        is pinned per reading list. Replies cannot be pinned.
      operationId: pinCollectionComment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
        - { $ref: '#/components/parameters/CommentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentPinInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comments:
    get:
      tags: [auth]
      summary: List comments of an owned reading list for governance
      description: >-
        Owner-only. Returns approved comments including soft-deleted ones, each
        with isTop, isDelete, replyCount and the number of pending reports.
      operationId: listOwnedCollectionComments
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
        - { name: current, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
        - { name: keywords, in: query, schema: { type: string } }
        - { name: includeDeleted, in: query, schema: { type: string, enum: ['1', 'true'] } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comments/batch:
    post:
      tags: [auth]
      summary: Batch delete, pin or unpin reading-list comments
      description: >-
        Owner-only. Action must be delete, pin or unpin. When several root
        comments are pinned in one request only the newest stays pinned; other
        roots are unpinned automatically. Items that cannot be moderated are
        returned per comment in failed[].message instead of failing the request.
      operationId: batchModerateCollectionComments
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentBatchInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comments/restore:
    post:
      tags: [auth]
      summary: Restore soft-deleted reading-list comments
      description: >-
        Owner-only. Restores the selected comments. Restoring a root comment also
        restores only the replies hidden by the same deletion, never replies the
        owner deleted separately.
      operationId: restoreOwnedCollectionComments
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRestoreInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comments/{commentId}:
    delete:
      tags: [auth]
      summary: Soft-delete one comment or reply on an owned reading list
      description: >-
        Only the reading-list owner may moderate. Deleting a root comment hides the
        comment together with all of its replies; deleting a reply hides only that
        reply. Deleted comments stay hidden from public listings, counts and
        notifications, and cannot be restored by the owner.
      operationId: deleteOwnedCollectionComment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
        - { $ref: '#/components/parameters/CommentId' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
