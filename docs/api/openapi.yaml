components:
  parameters:
    ArticleId: { name: articleId, in: path, required: true, schema: { type: integer, format: int64 } }
    AlbumId: { name: albumId, in: path, required: true, schema: { type: integer, format: int64 } }
    CommentId: { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
    CollectionId: { name: collectionId, in: path, required: true, schema: { type: integer, format: int64 } }
    TalkId: { name: talkId, in: path, required: true, schema: { type: integer, format: int64 } }
    UserInfoId: { name: userInfoId, in: path, required: true, schema: { type: integer, format: int64 } }
    AnalyticsRange: { name: range, in: query, schema: { type: string, enum: [7d, 30d, 90d, 12m], default: 7d } }
  responses:
    Result:
      description: Versioned API response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
  schemas:
    ApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: 操作成功 }
        data: { nullable: true }
    Page:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: {} }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 0 }
    PublicAuthorSummary:
      type: object
      required: [id, handle, nickname, avatar]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        intro: { type: string }
        website: { type: string }
    CollectionSaveInput:
      type: object
      required: [title, visibility]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, default: '' }
        visibility: { type: string, enum: [private, unlisted, public] }
    CollectionItemInput:
      type: object
      properties:
        note: { type: string, maxLength: 280, default: '' }
    CollectionOrderInput:
      type: object
      required: [articleIds]
      properties:
        articleIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: integer, format: int64 }
    CommentPinInput:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean, description: true pins the root comment and unpins any other pinned root comment on the same reading list }
    CommentReportInput:
      type: object
      required: [commentId, reason]
      properties:
        commentId: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, enum: [spam, harassment, porn, illegal, privacy, other] }
        detail: { type: string, maxLength: 200 }
    CommentAppealInput:
      type: object
      required: [commentId, reason]
      properties:
        commentId: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, maxLength: 500 }
    CommentModerationDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [dismiss, hide, restore, reject] }
        reason: { type: string, maxLength: 255 }
    CommentBatchInput:
      type: object
      required: [action, commentIds]
      properties:
        action: { type: string, enum: [delete, pin, unpin] }
        commentIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: integer, format: int64 }
    CommentRestoreInput:
      type: object
      required: [commentIds]
      properties:
        commentIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: integer, format: int64 }
    CollectionSubscriptionStatus:
      type: object
      required: [subscribed, muted]
      properties:
        subscribed: { type: boolean }
        muted: { type: boolean }
    CollectionReactionInput:
      type: object
      required: [collectionId, active]
      properties:
        collectionId: { type: integer, format: int64, minimum: 1 }
        reaction: { type: string, enum: [like, favorite], default: like }
        active: { type: boolean }
    CollectionReactionToggle:
      type: object
      required: [active, likeCount, favoriteCount]
      properties:
        active: { type: boolean }
        likeCount: { type: integer, minimum: 0 }
        favoriteCount: { type: integer, minimum: 0 }
    CollectionReactionState:
      type: object
      required: [collectionId, like, favorite]
      properties:
        collectionId: { type: integer, format: int64 }
        like: { type: boolean }
        favorite: { type: boolean }
    CollectionSubscription:
      type: object
      required: [collectionId, slug, title, articleCount, muted, unreadCount, subscribedAt]
      properties:
        collectionId: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        cover: { type: string }
        articleCount: { type: integer }
        owner: { $ref: '#/components/schemas/PublicAuthorSummary' }
        muted: { type: boolean }
        unreadCount: { type: integer }
        subscribedAt: { type: string, format: date-time }
    CollectionFeedItem:
      type: object
      required: [eventId, collectionId, slug, collectionTitle, articleId, articleTitle, publishedAt]
      properties:
        eventId: { type: integer, format: int64 }
        collectionId: { type: integer, format: int64 }
        slug: { type: string }
        collectionTitle: { type: string }
        articleId: { type: integer, format: int64 }
        articleTitle: { type: string }
        excerpt: { type: string }
        cover: { type: string }
        owner: { $ref: '#/components/schemas/PublicAuthorSummary' }
        publishedAt: { type: string, format: date-time }
    ArticleReadSession:
      type: object
      required: [sessionId, activeMs, maxScrollPercent]
      properties:
        sessionId: { type: string, minLength: 8, maxLength: 128, example: 2ef87de3-6b32-4a86-a726-f3aed96b4a7d }
        activeMs: { type: integer, minimum: 3000, maximum: 7200000 }
        maxScrollPercent: { type: number, minimum: 0, maximum: 100 }
    ArticleContinuationEvent:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          enum: [series_impression, series_click, related_impression, related_click]
        targetType: { type: string, enum: [article, series] }
        targetId: { type: integer, minimum: 1 }
        placement: { type: string, enum: [related, series_previous, series_next, series_index] }
        position: { type: integer, minimum: 0, maximum: 3 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
