openapi: 3.0.3
info:
  title: Stellar Beacon API
  version: 1.0.0
  description: Versioned HTTP contract for the Stellar Beacon blog and administration apps.
servers:
  - url: /api/v1
tags:
  - name: public
  - name: auth
  - name: admin
paths:
  /public/:
    get: { tags: [public], summary: Get blog home information, operationId: getBlogHomeInfo, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/about:
    get: { tags: [public], summary: Get about page, operationId: getAbout, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles:
    get: { tags: [public], summary: List public articles, operationId: listArticles, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/featured:
    get: { tags: [public], summary: Get top and featured articles, operationId: listFeaturedArticles, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/by-category:
    get: { tags: [public], summary: List articles by category, operationId: listArticlesByCategory, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/by-tag:
    get: { tags: [public], summary: List articles by tag, operationId: listArticlesByTag, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/search:
    get: { tags: [public], summary: Search articles, operationId: searchArticles, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/{articleId}:
    get: { tags: [public], summary: Get article detail, operationId: getArticle, parameters: [{ $ref: '#/components/parameters/ArticleId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/{articleId}/access:
    post: { tags: [public], summary: Verify article password, operationId: accessArticle, parameters: [{ $ref: '#/components/parameters/ArticleId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/articles/{articleId}/read-sessions:
    post:
      tags: [public]
      summary: Record an anonymous article reading session
      description: Accepts only a session id, active milliseconds and maximum scroll percentage. It does not accept or persist account, IP, User-Agent or referrer data.
      operationId: trackArticleReadSession
      parameters: [{ $ref: '#/components/parameters/ArticleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleReadSession' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/articles/{articleId}/continuation-events:
    post:
      tags: [public]
      summary: Record an anonymous article continuation event
      description: Accepts one allow-listed series or related-reading impression/click event. Clicks include the public target and placement; the endpoint does not accept account, session, IP, User-Agent or referrer data.
      operationId: trackArticleContinuationEvent
      parameters: [{ $ref: '#/components/parameters/ArticleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleContinuationEvent' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /public/archives:
    get: { tags: [public], summary: List article archives, operationId: listArchives, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/categories:
    get: { tags: [public], summary: List categories, operationId: listCategories, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/tags:
    get: { tags: [public], summary: List tags, operationId: listTags, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/tags/top:
    get: { tags: [public], summary: List popular tags, operationId: listPopularTags, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/comments:
    get: { tags: [public], summary: List comments, operationId: listComments, responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [public], summary: Create comment, operationId: createComment, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/comments/top:
    get: { tags: [public], summary: List recent comments, operationId: listRecentComments, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/comments/{commentId}/replies:
    get: { tags: [public], summary: List comment replies, operationId: listCommentReplies, parameters: [{ $ref: '#/components/parameters/CommentId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/links:
    get: { tags: [public], summary: List friend links, operationId: listFriendLinks, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/links/applications:
    post: { tags: [public], summary: Submit a friend link application, operationId: applyFriendLink, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/series:
    get: { tags: [public], summary: List article collections, operationId: listPublicSeries, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/series/{seriesId}:
    get: { tags: [public], summary: Get one collection with its ordered articles, operationId: getPublicSeries, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/albums:
    get: { tags: [public], summary: List photo albums, operationId: listAlbums, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/albums/{albumId}/photos:
    get: { tags: [public], summary: List album photos, operationId: listAlbumPhotos, parameters: [{ $ref: '#/components/parameters/AlbumId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/talks:
    get: { tags: [public], summary: List talks, operationId: listTalks, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/talks/{talkId}:
    get: { tags: [public], summary: Get talk detail, operationId: getTalk, parameters: [{ $ref: '#/components/parameters/TalkId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/users/{userInfoId}:
    get: { tags: [public], summary: Get public user information, operationId: getPublicUser, parameters: [{ $ref: '#/components/parameters/UserInfoId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/authors:
    get: { tags: [public], summary: List public authors, operationId: listPlatformAuthors, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/authors/{handle}:
    get: { tags: [public], summary: Get a public author profile, operationId: getAuthorByHandle, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/authors/{handle}/articles:
    get: { tags: [public], summary: List an author's public articles, operationId: listAuthorArticles, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/authors/{handle}/talks:
    get: { tags: [public], summary: List an author's public talks, operationId: listAuthorTalks, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/authors/{handle}/series:
    get: { tags: [public], summary: List an author's public series, operationId: listAuthorSeries, parameters: [{ name: handle, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/reports/visit:
    post: { tags: [public], summary: Report a visit, operationId: reportVisit, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /public/diagnostics/business-error:
    get: { tags: [public], summary: Trigger a business error for diagnostics, operationId: triggerBusinessError, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/login:
    post: { tags: [auth], summary: Sign in, operationId: login, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/logout:
    post: { tags: [auth], summary: Sign out, operationId: logout, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/register:
    post: { tags: [auth], summary: Register, operationId: register, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/verification-code:
    get: { tags: [auth], summary: Send verification code, operationId: sendVerificationCode, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/password:
    put: { tags: [auth], summary: Update password, operationId: updatePassword, responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me:
    put: { tags: [auth], summary: Update current user, operationId: updateCurrentUser, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/avatar:
    post: { tags: [auth], summary: Update current user avatar, operationId: updateCurrentAvatar, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/email:
    put: { tags: [auth], summary: Bind current user email, operationId: bindCurrentEmail, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/subscription:
    put: { tags: [auth], summary: Update subscription, operationId: updateSubscription, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/notifications:
    put: { tags: [auth], summary: Set the comment email notification preference, operationId: updateCommentNotice, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    get: { tags: [auth], summary: List follow notifications, operationId: listFollowNotifications, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/notifications/unread-count:
    get: { tags: [auth], summary: Count unread follow notifications, operationId: getUnreadFollowNotifications, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/notifications/read:
    post: { tags: [auth], summary: Mark follow notifications read, operationId: markFollowNotificationsRead, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/following/{authorId}:
    put: { tags: [auth], summary: Follow an author, operationId: followAuthor, security: [{ bearerAuth: [] }], parameters: [{ name: authorId, in: path, required: true, schema: { type: integer, format: int64 } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [auth], summary: Unfollow an author, operationId: unfollowAuthor, security: [{ bearerAuth: [] }], parameters: [{ name: authorId, in: path, required: true, schema: { type: integer, format: int64 } }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/following:
    get: { tags: [auth], summary: List authors followed by the current account, operationId: listFollowingAuthors, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/followers:
    get: { tags: [auth], summary: List followers of the current account, operationId: listAuthorFollowers, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/following-feed:
    get: { tags: [auth], summary: List content from followed authors, operationId: listFollowingFeed, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/reactions:
    put: { tags: [auth], summary: Set the like or favourite state of an article, operationId: toggleArticleReaction, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    get: { tags: [auth], summary: List the current account reactions, operationId: listMyArticleReactions, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /auth/me/reactions/state:
    get: { tags: [auth], summary: Read reaction state for a set of articles, operationId: listArticleReactionStates, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/dashboard:
    get: { tags: [admin], summary: Get dashboard information, operationId: getAdminDashboard, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/content/analytics:
    get:
      tags: [admin]
      summary: Get site-wide content performance
      operationId: getContentAnalytics
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AnalyticsRange' }]
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /admin/content/analytics/articles:
    get:
      tags: [admin]
      summary: List article performance with cross-day unique readers
      operationId: listContentAnalyticsArticles
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/AnalyticsRange' }
        - { name: sort, in: query, schema: { type: string, enum: [views, uniqueReaders, effectiveSessions, avgActiveMs, completionRate], default: views } }
        - { name: current, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /admin/content/analytics/continuation-targets:
    get:
      tags: [admin]
      summary: List attributed continuation targets
      operationId: listContentContinuationTargets
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [7d, 30d, 90d, 12m] } }
        - { name: sort, in: query, schema: { type: string, enum: [clicks, clickRate] } }
        - { name: sourceArticleId, in: query, schema: { type: integer, minimum: 1 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /admin/content/analytics/articles/{articleId}:
    get:
      tags: [admin]
      summary: Get one article's performance detail
      operationId: getContentAnalyticsArticle
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ArticleId' }
        - { $ref: '#/components/parameters/AnalyticsRange' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /admin/articles:
    get: { tags: [admin], summary: List admin articles, operationId: listAdminArticles, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save an article, operationId: saveAdminArticle, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/articles/{articleId}:
    get: { tags: [admin], summary: Get admin article, operationId: getAdminArticle, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/ArticleId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/articles/images:
    post: { tags: [admin], summary: Upload article image, operationId: uploadArticleImage, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/articles/import:
    post: { tags: [admin], summary: Import articles, operationId: importArticles, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/articles/export:
    post: { tags: [admin], summary: Export articles, operationId: exportArticles, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/articles/featured:
    put: { tags: [admin], summary: Update article flags, operationId: updateArticleFlags, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/articles/trash:
    put: { tags: [admin], summary: Move articles to or from trash, operationId: updateArticleTrash, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/articles/batch-delete:
    delete: { tags: [admin], summary: Permanently delete articles, operationId: deleteArticles, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/site:
    get: { tags: [admin], summary: Get website configuration, operationId: getSite, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    put: { tags: [admin], summary: Update website configuration, operationId: updateSite, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/site/images:
    post: { tags: [admin], summary: Upload website image, operationId: uploadSiteImage, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/about:
    put: { tags: [admin], summary: Update about page, operationId: updateAbout, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/categories:
    get: { tags: [admin], summary: List admin categories, operationId: listAdminCategories, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save category, operationId: saveCategory, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete categories, operationId: deleteCategories, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/categories/search:
    get: { tags: [admin], summary: Search admin categories, operationId: searchAdminCategories, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/tags:
    get: { tags: [admin], summary: List admin tags, operationId: listAdminTags, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/series:
    get: { tags: [admin], summary: List article collections, operationId: listAdminSeries, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Create or update an article collection, operationId: saveSeries, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete article collections, operationId: deleteSeries, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/series/options:
    get: { tags: [admin], summary: List article collection options, operationId: listSeriesOptions, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save tag, operationId: saveTag, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete tags, operationId: deleteTags, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/tags/search:
    get: { tags: [admin], summary: Search admin tags, operationId: searchAdminTags, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/comments:
    get: { tags: [admin], summary: List admin comments, operationId: listAdminComments, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete comments, operationId: deleteComments, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/comments/review:
    put: { tags: [admin], summary: Review comments, operationId: reviewComments, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/friend-links:
    get: { tags: [admin], summary: List friend links, operationId: listAdminFriendLinks, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save friend link, operationId: saveFriendLink, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete friend links, operationId: deleteFriendLinks, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/friend-links/review:
    put: { tags: [admin], summary: Approve or reject friend link applications, operationId: reviewFriendLinks, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/albums:
    get: { tags: [admin], summary: List albums, operationId: listAdminAlbums, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save album, operationId: saveAlbum, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/albums/{albumId}:
    get: { tags: [admin], summary: Get album, operationId: getAdminAlbum, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/AlbumId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete album, operationId: deleteAlbum, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/AlbumId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/albums/options:
    get: { tags: [admin], summary: List album options, operationId: listAlbumOptions, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/albums/cover:
    post: { tags: [admin], summary: Upload album cover, operationId: uploadAlbumCover, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/photos:
    get: { tags: [admin], summary: List photos, operationId: listAdminPhotos, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save photos, operationId: savePhotos, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    put: { tags: [admin], summary: Update photo, operationId: updatePhoto, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete photos, operationId: deletePhotos, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/photos/trash:
    put: { tags: [admin], summary: Update photo trash status, operationId: updatePhotoTrash, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/photos/album:
    put: { tags: [admin], summary: Move photos to an album, operationId: movePhotosToAlbum, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/photos/upload:
    post: { tags: [admin], summary: Upload photo, operationId: uploadPhoto, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/talks:
    get: { tags: [admin], summary: List admin talks, operationId: listAdminTalks, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save talk, operationId: saveTalk, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    delete: { tags: [admin], summary: Delete talks, operationId: deleteTalks, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/talks/{talkId}:
    get: { tags: [admin], summary: Get admin talk, operationId: getAdminTalk, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/TalkId' }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/talks/images:
    post: { tags: [admin], summary: Upload talk image, operationId: uploadTalkImage, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/permissions:
    get: { tags: [admin], summary: List permissions, operationId: listPermissions, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
    post: { tags: [admin], summary: Save permission, operationId: savePermission, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/permissions/{resourceId}:
    delete: { tags: [admin], summary: Delete permission, operationId: deletePermission, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/Result' } } }
  /admin/roles:
