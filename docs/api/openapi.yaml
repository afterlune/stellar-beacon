        - { name: sort, in: query, schema: { type: string, enum: [views, uniqueReaders, effectiveSessions, avgActiveMs, completionRate], default: views } }
        - { name: current, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /admin/content/analytics/continuation-targets:
