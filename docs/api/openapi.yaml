  /auth/me/comment-reports:
    post:
      tags: [auth]
      summary: Report a reading-list comment
      description: >-
        Signed-in readers report a visible approved reading-list comment or reply.
        One reader may hold a single pending report per comment; reporting your own
        comment is rejected. Reasons are spam, harassment, porn, illegal, privacy
        or other, with an optional 200-character detail.
      operationId: reportComment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentReportInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /auth/me/comment-appeals:
    post:
      tags: [auth]
      summary: Appeal a hidden reading-list comment
      description: >-
        Only the author of a hidden comment may appeal, and only while the comment
        stays hidden. One pending appeal per comment and appellant is allowed.
      operationId: appealComment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentAppealInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
