  /auth/me/comment-appeals/{appealId}/escalate:
    post:
      tags: [auth]
      summary: Escalate a rejected appeal to an administrator
      description: >-
        Allowed only for the appellant, after the reading-list owner rejected an
        owner-stage appeal. The appeal returns to the administrator queue.
      operationId: escalateCommentAppeal
      security: [{ bearerAuth: [] }]
      parameters: [{ name: appealId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses: { '200': { $ref: '#/components/responses/Result' } }
