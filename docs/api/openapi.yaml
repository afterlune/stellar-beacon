      summary: List pending reports grouped by comment for an owned reading list
      operationId: listOwnerCommentReports
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CollectionId' }]
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comment-reports/{commentId}:
    put:
      tags: [auth]
      summary: Resolve every pending report on one comment as the reading-list owner
      description: Decision is dismiss, hide or restore; hide soft-deletes the comment, restore revives it.
      operationId: resolveOwnerCommentReports
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CollectionId' }, { $ref: '#/components/parameters/CommentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentModerationDecisionInput' }
      responses: { '200': { $ref: '#/components/responses/Result' } }
  /studio/collections/{collectionId}/comment-appeals:
