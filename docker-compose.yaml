services:
  benetnasch:
    image: benetnasch:latest
    container_name: demo-user
    ports:
      - '7777:7777'
    volumes:
      - ./stellar-beacon/resource:/app/resource
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      - ALIYUN_OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID:?ALIYUN_OSS_ACCESS_KEY_ID is required}
      - ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET:?ALIYUN_OSS_ACCESS_KEY_SECRET is required}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      - JWT_ALLOW_EPHEMERAL=false
    restart: always
  postgresql:
    image: postgres:latest
    container_name: pg
    ports:
      - '5432:5432'
    volumes:
      - D:/containerData/pasql/data:/var/lib/postgresql/data
    environment:
      - TZ=Asia/Shanghai
      - PGDATA=/var/lib/postgresql/data
      - LANG=C.UTF-8
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: always
  #  nginx:
  #    image: nginx:stable
  #    container_name: nginx
  #    ports:
  #      - '80:80'
  #      - '8008:8008'
  #    volumes:
  #      - /nginx/conf/nginx.conf:/etc/nginx/nginx.conf
  #      - /nginx/vue:/usr/local/vue
  #    environment:
  #      - TZ=Asia/Shanghai
  #    restart: always
  caddy:
    image: caddy:2.8
    container_name: caddy
    cap_add:
      - NET_ADMIN
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
      - '8008:8008/udp'
      - '8008:8008'
    volumes:
      - D:/containerData/caddy/Caddyfile:/etc/caddy/Caddyfile
      - D:/containerData/caddy/static:/srv
      - D:/containerData/caddy/caddy.log:/var/log/caddy.log
      - D:/containerData/caddy/config:/config
      - D:/containerData/caddy/data:/data
    environment:
      - TZ=Asia/Shanghai
    restart: always
  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - '6379:6379'
    volumes:
      - D:/containerData/redis/data:/data
    environment:
      - TZ=Asia/Shanghai
    restart: always
  meiliSearch:
    image: getmeili/meilisearch:v1.1
    container_name: meili
    ports:
      - '7700:7700'
    volumes:
      - D:/containerData/meilisearch/data:/meili_data
    environment:
      - MEILI_NO_ANALYTICS=true
      - TZ=Asia/Shanghai
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      - MEILI_ENV=production
    restart: always
