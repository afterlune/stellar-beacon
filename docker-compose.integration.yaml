services:
  postgresql:
    image: postgres:16.15-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: benetnasch
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - integration-postgres-data:/var/lib/postgresql/data
      - ./docs/benetnasch.sql:/docker-entrypoint-initdb.d/001-benetnasch.sql:ro
      - ./scripts/integration-repair-sequences.sql:/docker-entrypoint-initdb.d/002-repair-sequences.sql:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d benetnasch"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.0-alpine3.23
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    volumes:
      - integration-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      TZ: Asia/Shanghai
    ports:
      - "17700:7700"
    volumes:
      - integration-meili-data:/meili_data

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - integration-minio-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BENETNASCH_ENV: integration
      JWT_ALLOW_EPHEMERAL: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "17777:7777"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started

  caddy:
    image: caddy:2.8.4
    ports:
      - "18080:80"
      - "18008:8008"
    volumes:
      - ./deploy/integration/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/blog/dist:/srv/vue/blog:ro
      - ./web/admin/dist:/srv/vue/admin:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  integration-postgres-data:
  integration-redis-data:
  integration-meili-data:
  integration-minio-data:
