<!doctype html>
<html lang="zh-CN">
<body style="margin:0;background:#f3f5f7;color:#18222d;font-family:Arial,'Microsoft YaHei',sans-serif;">
  <div style="max-width:640px;margin:36px auto;padding:28px;background:#ffffff;border:1px solid #e7ebef;border-radius:16px;">
    <p style="margin:0 0 10px;color:#6b7785;font-size:12px;letter-spacing:.16em;text-transform:uppercase;">STELLAR BEACON</p>
    <h1 style="margin:0 0 18px;font-size:26px;line-height:1.35;">{{.title}}</h1>
    <p style="color:#52606d;line-height:1.8;">{{.description}}</p>
    <p style="margin:28px 0;">
      <a href="{{.actionURL}}" style="display:inline-block;padding:12px 20px;background:#18222d;color:#fff;text-decoration:none;border-radius:999px;">{{.actionLabel}}</a>
    </p>
    <p style="margin:0;color:#8a96a3;font-size:12px;line-height:1.7;">如果你不想继续接收通知，可在文章邮件底部使用退订链接：<a href="{{.unsubscribeURL}}">停止订阅</a>。</p>
  </div>
</body>
</html>
