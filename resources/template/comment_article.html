<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新评论</title>
</head>
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#3d3d3d;">
<div style="max-width:620px;margin:0 auto;background:#ffffff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden;">
    <div style="padding:22px 28px;background:linear-gradient(0deg,#43c6b8,#ffd1f4);color:#ffffff;">
        <p style="margin:0;font-size:16px;font-weight:600;">Stellar Beacon · 新评论</p>
    </div>
    <div style="padding:24px 28px;font-size:14px;line-height:1.7;">
        <p style="margin:0 0 12px;">{{.nickname}}，你好：</p>
        <p style="margin:0 0 12px;">你的文章《{{.articleTitle}}》收到了新评论：</p>
        <blockquote style="margin:0 0 16px;padding:12px 16px;background:#f7f8fa;border-left:3px solid #43c6b8;border-radius:6px;white-space:pre-wrap;">{{.commentContent}}</blockquote>
        <p style="margin:0 0 20px;">
            <a href="{{.articleUrl}}" style="display:inline-block;padding:10px 18px;border-radius:999px;background:#43c6b8;color:#ffffff;text-decoration:none;">查看评论</a>
        </p>
        <p style="margin:0;color:#8c8c8c;font-size:12px;">你可以在个人中心关闭评论邮件通知。</p>
    </div>
</div>
</body>
</html>
